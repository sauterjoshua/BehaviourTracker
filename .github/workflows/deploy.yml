name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: config.js aus Repository-Secrets erzeugen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HCAPTCHA_SITE_KEY: ${{ secrets.HCAPTCHA_SITE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL und SUPABASE_ANON_KEY muessen als Repository-Secrets gesetzt sein."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const cfg = {
              SUPABASE_URL: process.env.SUPABASE_URL,
              SUPABASE_ANON_KEY: process.env.SUPABASE_ANON_KEY,
              HCAPTCHA_SITE_KEY: process.env.HCAPTCHA_SITE_KEY || ""
            };
            fs.writeFileSync("config.js",
              "// Automatisch im Deploy erzeugt – nicht committen.\n" +
              "export const CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n");
          '
          echo "config.js erzeugt."

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
