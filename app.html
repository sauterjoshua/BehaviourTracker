<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="BehaviourTracker – Klassen, Unterrichte und Fokus-Wald.">
  <meta name="robots" content="noindex">
  <title>BehaviourTracker</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <button class="topbar__back" id="backBtn" type="button" hidden aria-label="Zurueck">&#8592;</button>
    <h1 class="topbar__title" id="topbarTitle">BehaviourTracker</h1>
    <div class="topbar__actions">
      <span class="topbar__user" id="topbarUser"></span>
      <button class="btn btn--ghost" id="logoutBtn" type="button">Abmelden</button>
    </div>
  </header>

  <main id="app" class="app">
    <div class="loading">Wird geladen&hellip;</div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://js.hcaptcha.com/1/api.js?render=explicit" async defer></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
